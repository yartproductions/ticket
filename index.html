<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A7CF5">
<title>Ticket</title>
<style>
  :root {
    --blue: #0A7CF5;
    --blue-deep: #0663C4;
    --red: #F4302A;
    --page: #F2F2F5;
    --ink: #111114;
    --ink-soft: #5A5A63;
    --ink-faint: #8A8A93;
    --line: #E4E4E7;
    --card-radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100dvh;
  }
  .band {
    position: absolute;
    top: 0; left: 0; right: 0;
    width: 100%;
    height: calc(300px + env(safe-area-inset-top));
    background: var(--blue);
    border-radius: 0 0 32px 32px;
    z-index: 0;
  }
  .shell {
    position: relative;
    z-index: 1;
    max-width: 420px;
    margin: 0 auto;
    padding: max(14px, env(safe-area-inset-top)) 12px 32px;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 2px 16px;
  }
  .back {
    flex: 0 0 auto;
    width: 38px; height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 10px;
    background: rgba(255,255,255,0.25);
    color: #fff;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    transition: background 140ms ease;
  }
  .back:hover { background: rgba(255,255,255,0.38); }
  .back:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .title {
    flex: 1;
    text-align: center;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding-right: 38px;
  }
  .qr-image {
    width: 500px; 
    height: 500px; 
    display: block;
    margin: 0 auto;
    object-fit: contain;
  }
  .brand {
    position: absolute;
    top: max(18px, env(safe-area-inset-top));
    right: 16px;
    z-index: 2;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.16em;
  }
  .card {
    background: #fff;
    border-radius: var(--card-radius);
    padding: 20px 16px 20px;
    box-shadow: 0 1px 3px rgba(16,24,40,0.06), 0 8px 24px rgba(16,24,40,0.06);
    display: flex;
    flex-direction: column;
    min-height: 480px; 
  }
  .code-frame {
    width: 200px;
    margin: 0 auto;
    border: 7px solid var(--red);
    border-radius: 14px;
    padding: 0; 
    background: var(--red);
    overflow: hidden; 
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }
  .code-slot {
    width: 100%;
    aspect-ratio: 1;
    background: var(--red);
    border: none;
    border-radius: 0; 
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: background-color 0.3s ease;
  }
  .code-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover; 
    display: block;
  }
  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--ink-faint);
    margin: 13px 0 15px;
  }
.rule {
    border: 0;
    height: 2px;
    background: repeating-linear-gradient(
      to right,
      #D2D2D6 0px,
      #D2D2D6 4px,
      transparent 4px,
      transparent 12px
    );
    width: 60%; /* Shrinks the line so it looks neat and compact */
    margin: 0 auto 20px; /* 'auto' on left and right centers it perfectly under the frame */
  }
  .row { text-align: center; }
  .eyebrow {
    margin: 0;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .primary-id {
    margin: 0px 0 0px;
    font-size: 40px;
    font-weight: 700;
    line-height: 1.15;
    word-break: break-word;
  }
  .sub {
    margin: 0;
    font-size: 26px;
    font-weight: 600;
  }
  .meta {
    margin: 0px 0 0;
    font-size: 13px;
    color: #66668a;
  }

  /* --- TIMER & ANIMATED COLOR BAR STYLES --- */
  .status-widget {
    margin-top: 250px; 
    text-align: center;
  }

  .color-bar {
    display: flex;
    height: 8px;
    width: 100%;
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 12px;
    animation: fadePulse 2s ease-in-out infinite;
  }
  .color-block { flex: 1; height: 100%; }
  .color-block.blue { background-color: #2155FF; }
  .color-block.peach { background-color: #F8D3C5; }
  .color-block.teal { background-color: #4A807E; }

  @keyframes fadePulse {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
  }

  .progress-track {
    width: 80%;
    height: 6px;
    background-color: #DDE2E8;
    border-radius: 3px;
    margin: 0 auto 16px;
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 100%;
    background-color: #2155FF;
    border-radius: 3px;
    transition: width 1s linear;
  }

  .expiration-text {
    font-size: 16px;
    color: #111114;
    margin-bottom: 16px;
  }
  .expiration-text span {
    font-weight: 700;
  }

  .action {
    display: block;
    width: 100%;
    margin: 0 0 0; 
    padding: 13px 12px;
    border: 0;
    border-radius: 10px;
    background: var(--line);
    color: #333338;
    font-family: inherit;
    font-size: 13px;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    transition: background 140ms ease;
  }
  .action:hover { background: #D8D8DD; }
  .action:focus-visible { outline: 2px solid var(--blue-deep); outline-offset: 2px; }

  /* --- ADJUSTMENT MODAL POPUP STYLES --- */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-card {
    background: #fff;
    width: 90%;
    max-width: 340px;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .modal-card h3 {
    margin-top: 0;
    font-size: 16px;
    text-align: center;
    margin-bottom: 14px;
  }
  .modal-section {
    margin-bottom: 14px;
  }
  .modal-section label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--ink-soft);
  }
  .color-picker-grid {
    display: flex;
    gap: 6px;
    justify-content: space-between;
  }
  .color-option {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .color-option:hover { transform: scale(1.1); }
  .color-option.selected { border-color: #111114; transform: scale(1.1); }

  .number-picker-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .num-btn {
    padding: 8px;
    background: var(--page);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
  }
  .num-btn.selected {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
  }
  .modal-close-btn {
    width: 100%;
    padding: 10px;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }

  @media (max-width: 360px) {
    .code-frame { width: 168px; }
    .primary-id { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="band" aria-hidden="true"></div>

<main class="shell">
  <div class="topbar">
    <button class="back" type="button" aria-label="Go back" onclick="history.back()">&#8249;</button>
    <div class="title">One Way Ticket</div>
  </div>

  <section class="card">
    <div class="code-frame" id="code-frame">
      <div class="code-slot" id="code-slot">
        <img src="./qr.PNG" alt="QR Code" class="qr-image">
      </div>
    </div>

    <p class="hint">Tap to enlarge</p>
    <hr class="rule">

    <div class="row">
      <p class="eyebrow">INTRASTATE</p>
      <p class="primary-id" id="primary-id-target">2</p>
      <p class="sub">ZONE RIDE</p>
      <p class="meta">1 Adult</p>
    </div>

    <div class="status-widget">
      <div class="color-bar">
        <div class="color-block blue"></div>
        <div class="color-block peach"></div>
        <div class="color-block teal"></div>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div class="expiration-text">
        Expires in: <span id="timer-display">30:00</span>
      </div>

      <button class="action" id="reset-btn" type="button">View Onboard Validator Instructions</button>
    </div>
  </section>
</main>

<div class="modal-overlay" id="settings-modal">
  <div class="modal-card">
    <h3>Card Settings</h3>
    
    <div class="modal-section">
      <label>Frame Background Color</label>
      <div class="color-picker-grid">
        <div class="color-option" style="background: #9B51E0;" data-color="#9B51E0" title="Purple"></div>
        <div class="color-option" style="background: #27AE60;" data-color="#27AE60" title="Green"></div>
        <div class="color-option" style="background: #7F8C8D;" data-color="#7F8C8D" title="Grey"></div>
        <div class="color-option" style="background: #F2C94C;" data-color="#F2C94C" title="Yellow"></div>
        <div class="color-option selected" style="background: #F4302A;" data-color="#F4302A" title="Red"></div>
        <div class="color-option" style="background: #F6C3CC;" data-color="#F6C3CC" title="Pink"></div>
        <div class="color-option" style="background: #0A7CF5;" data-color="#0A7CF5" title="Blue"></div>
      </div>
    </div>

    <div class="modal-section">
      <label>Primary ID Number (1-8)</label>
      <div class="number-picker-grid">
        <button class="num-btn selected" data-num="1">1</button>
        <button class="num-btn" data-num="2">2</button>
        <button class="num-btn" data-num="3">3</button>
        <button class="num-btn" data-num="4">4</button>
        <button class="num-btn" data-num="5">5</button>
        <button class="num-btn" data-num="6">6</button>
        <button class="num-btn" data-num="7">7</button>
        <button class="num-btn" data-num="8">8</button>
      </div>
    </div>

    <button class="modal-close-btn" id="close-modal-btn">Apply & Reset</button>
  </div>
</div>

<script>
  const totalDuration = 30 * 60; // 30 minutes in seconds
  let timeRemaining = totalDuration;

  const timerDisplay = document.getElementById('timer-display');
  const progressFill = document.getElementById('progress-fill');
  const actionBtn = document.getElementById('reset-btn');
  const colorBlocks = document.querySelectorAll('.color-block');

  // Modal elements
  const modal = document.getElementById('settings-modal');
  const closeModalBtn = document.getElementById('close-modal-btn');
  const codeFrame = document.getElementById('code-frame');
  const codeSlot = document.getElementById('code-slot');
  const primaryIdTarget = document.getElementById('primary-id-target');
  const colorOptions = document.querySelectorAll('.color-option');
  const numButtons = document.querySelectorAll('.num-btn');

  const colorPalette = ['#2155FF', '#F8D3C5', '#4A807E', '#FF5733', '#33FF57', '#9B51E0', '#F2994A', '#E0245E', '#17BF63'];

  function randomizeBlockColors() {
    colorBlocks.forEach(block => {
      const randomIndex = Math.floor(Math.random() * colorPalette.length);
      block.style.backgroundColor = colorPalette[randomIndex];
    });
  }

  function updateTimer() {
    const minutes = Math.floor(timeRemaining / 60);
    const seconds = timeRemaining % 60;

    const formattedMinutes = String(minutes).padStart(2, '0');
    const formattedSeconds = String(seconds).padStart(2, '0');
    timerDisplay.textContent = `${formattedMinutes}:${formattedSeconds}`;

    const progressPercent = ((totalDuration - timeRemaining) / totalDuration) * 100;
    progressFill.style.width = `${progressPercent}%`;

    if (timeRemaining > 0) {
      timeRemaining--;
    } else {
      timerDisplay.textContent = "00:00";
    }
  }

  // Open adjustment screen when clicking the "-" button
  if (actionBtn) {
    actionBtn.addEventListener('click', () => {
      modal.classList.add('active');
    });
  }

  // Close modal, apply changes, and reset timer/colors
  if (closeModalBtn) {
    closeModalBtn.addEventListener('click', () => {
      timeRemaining = totalDuration; 
      randomizeBlockColors();        
      updateTimer();                 
      modal.classList.remove('active');
    });
  }

  // Handle frame color selection
  colorOptions.forEach(option => {
    option.addEventListener('click', () => {
      colorOptions.forEach(opt => opt.classList.remove('selected'));
      option.classList.add('selected');
      const selectedColor = option.getAttribute('data-color');
      codeFrame.style.borderColor = selectedColor;
      codeFrame.style.backgroundColor = selectedColor;
      codeSlot.style.backgroundColor = selectedColor;
    });
  });

  // Handle number target selection (1-8)
  numButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      numButtons.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      primaryIdTarget.textContent = btn.getAttribute('data-num');
    });
  });

  // Initialize display
  randomizeBlockColors();
  updateTimer();
  setInterval(updateTimer, 1000);
</script>

</body>
</html>
