<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A7CF5">
<title>SYG — Item Card</title>
<style>
  :root {
    --blue: #0A7CF5;
    --blue-deep: #0663C4;
    --red: #F4302A;F
    --page: #F2F2F5;
    --ink: #111114;
    --ink-soft: #5A5A63;
    --ink-faint: #8A8A93;
    --line: #E4E4E7;
    --card-radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100dvh;
  }
  .band {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 300px;
    background: var(--blue);
    border-radius: 0 0 32px 32px;
    z-index: 0;
  }
  .shell {
    position: relative;
    z-index: 1;
    max-width: 420px;
    margin: 0 auto;
    padding: max(14px, env(safe-area-inset-top)) 12px 32px;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 2px 16px;
  }
  .back {
    flex: 0 0 auto;
    width: 38px; height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 10px;
    background: rgba(255,255,255,0.25);
    color: #fff;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    transition: background 140ms ease;
  }
  .back:hover { background: rgba(255,255,255,0.38); }
  .back:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .title {
    flex: 1;
    text-align: center;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding-right: 38px;
  }
  .brand {
    position: absolute;
    top: max(18px, env(safe-area-inset-top));
    right: 16px;
    z-index: 2;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.16em;
  }
  .card {
    background: #fff;
    border-radius: var(--card-radius);
    padding: 20px 16px 22px;
    box-shadow: 0 1px 3px rgba(16,24,40,0.06), 0 8px 24px rgba(16,24,40,0.06);
  }
  .code-frame {
    width: 200px;
    margin: 0 auto;
    border: 7px solid var(--red);
    border-radius: 14px;
    padding: 10px;
  }
  .code-slot {
    width: 100%;
    aspect-ratio: 1;
    background: #F0F0F0;
    border: 1px solid #D8D8DC;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 11px;
    line-height: 1.45;
    color: #6B6B72;
    padding: 8px;
    overflow: hidden;
  }
  .code-slot img, .code-slot svg, .code-slot canvas {
    width: 100%; height: 100%; object-fit: contain; display: block;
  }
  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--ink-faint);
    margin: 13px 0 15px;
  }
  .rule {
    border: 0;
    border-top: 1.5px dashed #D2D2D6;
    margin: 0 0 20px;
  }
  .row { text-align: center; }
  .eyebrow {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .primary-id {
    margin: 7px 0 16px;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.15;
    word-break: break-word;
  }
  .sub {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
  }
  .meta {
    margin: 5px 0 0;
    font-size: 12px;
    color: var(--ink-faint);
  }

  /* --- TIMER & ANIMATED COLOR BAR STYLES --- */
  .status-widget {
    margin-top: 30px;
    text-align: center;
  }

  /* Three multi-colored blocks with pulsing fade effect */
  .color-bar {
    display: flex;
    height: 8px;
    width: 100%;
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 12px;
    animation: fadePulse 2s ease-in-out infinite;
  }
  .color-block { flex: 1; height: 100%; }
  .color-block.blue { background-color: #2155FF; }
  .color-block.peach { background-color: #F8D3C5; }
  .color-block.teal { background-color: #4A807E; }

  /* Fade animation keyframes */
  @keyframes fadePulse {
    0% {
      opacity: 1;
    }
    50% {
      opacity: 0.35;
    }
    100% {
      opacity: 1;
    }
  }

  /* Moving Progress Track and Handle */
  .progress-track {
    width: 80%;
    height: 6px;
    background-color: #DDE2E8;
    border-radius: 3px;
    margin: 0 auto 16px;
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 100%;
    background-color: #2155FF;
    border-radius: 3px;
    transition: width 1s linear;
  }

  /* Expiration Text Display */
  .expiration-text {
    font-size: 16px;
    color: #111114;
    margin-bottom: 16px;
  }
  .expiration-text span {
    font-weight: 700;
  }

  .action {
    display: block;
    width: 100%;
    margin: 10px 0 0;
    padding: 13px 12px;
    border: 0;
    border-radius: 10px;
    background: var(--line);
    color: #333338;
    font-family: inherit;
    font-size: 13px;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    transition: background 140ms ease;
  }
  .action:hover { background: #D8D8DD; }
  .action:focus-visible { outline: 2px solid var(--blue-deep); outline-offset: 2px; }
  .foot {
    text-align: center;
    font-size: 11px;
    color: var(--ink-faint);
    margin: 18px 0 0;
    letter-spacing: 0.04em;
  }
  @media (max-width: 360px) {
    .code-frame { width: 168px; }
    .primary-id { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="band" aria-hidden="true"></div>

<main class="shell">

  <div class="topbar">
    <button class="back" type="button" aria-label="Go back" onclick="history.back()">&#8249;</button>
    <div class="title">One Way Ticket</div>
  </div>

  <section class="card">



    <div class="code-frame">

        <div class="color-block blue"></div>

      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div class="expiration-text">
        Expires in: <span id="timer-display">30:00</span>
      </div>

    <button class="action" type="button">View Onboard Validator Instructions</button>

  </section>


</main>

<script>
  // Total timer duration in seconds (30 minutes = 1800s)
  const totalDuration = 30 * 60;
  let timeRemaining = totalDuration;

  const timerDisplay = document.getElementById('timer-display');
  const progressFill = document.getElementById('progress-fill');

  function updateTimer() {
    const minutes = Math.floor(timeRemaining / 60);
    const seconds = timeRemaining % 60;

    // Format MM:SS
    const formattedMinutes = String(minutes).padStart(2, '0');
    const formattedSeconds = String(seconds).padStart(2, '0');
    timerDisplay.textContent = `${formattedMinutes}:${formattedSeconds}`;

    // Update progress bar percentage width
    const progressPercent = (timeRemaining / totalDuration) * 100;
    progressFill.style.width = `${progressPercent}%`;

    if (timeRemaining > 0) {
      timeRemaining--;
    } else {
      clearInterval(timerInterval);
      timerDisplay.textContent = "00:00";
    }
  }

  // Initialize and run interval every 1 second
  updateTimer();
  const timerInterval = setInterval(updateTimer, 1000);
</script>

</body>
